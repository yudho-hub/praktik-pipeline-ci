# Pipeline CI: build dan test otomatis setiap ada perubahan kode
name: CI

# Kapan pipeline berjalan
on:
  push:               # setiap push ke branch mana pun
  pull_request:       # setiap Pull Request
  workflow_dispatch:  # tombol "Run workflow" di tab Actions (manual)

# Hak akses minimal: workflow hanya perlu membaca isi repository
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v7

      - name: Siapkan Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependensi
        run: npm ci

      - name: Build (dilewati jika tidak ada script build)
        run: npm run build --if-present

      - name: Jalankan test
        run: npm test
